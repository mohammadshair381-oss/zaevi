<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Site Studio — ZAEVI</title>
  <link rel="stylesheet" href="/site-studio.css">
</head>
<body>
  <header class="st-top">
    <div class="st-brand">
      <a class="st-back" href="/admin">← Dashboard</a>
      <h1>Site Studio</h1>
      <span class="st-status" id="saveStatus" role="status" aria-live="polite">Loading…</span>
    </div>
    <div class="st-actions">
      <div class="st-device" role="group" aria-label="Preview size">
        <button type="button" class="st-chip is-on" data-device="desktop" aria-pressed="true">Desktop</button>
        <button type="button" class="st-chip" data-device="phone" aria-pressed="false">Phone</button>
      </div>
      <a class="st-btn" href="/" target="_blank" rel="noopener">View live site</a>
      <button type="button" class="st-btn" id="discardBtn" disabled>Discard changes</button>
      <button type="button" class="st-btn" id="undoBtn" disabled>Undo last publish</button>
      <button type="button" class="st-btn st-btn--primary" id="publishBtn" disabled>Publish</button>
    </div>
  </header>

  <p class="st-error" id="errorBar" role="alert" hidden></p>

  <div class="st-main">
    <aside class="st-panel" aria-label="Website settings">
      <nav class="st-tabs" role="tablist" aria-label="What to edit">
        <button type="button" role="tab" class="st-tab is-on" data-tab="sections" aria-selected="true">Sections</button>
        <button type="button" role="tab" class="st-tab" data-tab="hero" aria-selected="false">Main banner</button>
        <button type="button" role="tab" class="st-tab" data-tab="ticker" aria-selected="false">Top strip</button>
        <button type="button" role="tab" class="st-tab" data-tab="look" aria-selected="false">Colour &amp; movement</button>
      </nav>
      <div class="st-body" id="panelBody"></div>
    </aside>
    <section class="st-preview" aria-label="Live preview">
      <div class="st-frame" id="previewFrame">
        <iframe id="preview" title="Live preview of your homepage" src="/index.html?studioPreview=1"></iframe>
      </div>
    </section>
  </div>

  <script src="/site-studio.js"></script>
</body>
</html>
