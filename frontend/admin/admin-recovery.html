<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Emergency sign-in | ZAEVI</title><link rel="stylesheet" href="/css/style.css"></head><body class="content-page">
<main id="main"><section class="section"><div class="page-intro"><div class="eyebrow">ZAEVI / ADMIN</div><h1>Emergency sign-in</h1><p>For administrators only, when sign-in codes cannot be emailed.</p></div>
<form class="simple-form" id="recoveryForm"><label class="label" for="recoveryEmail">EMAIL</label><input class="forminput" id="recoveryEmail" type="email" autocomplete="username" required>
<label class="label" for="recoveryPassword">PASSWORD</label><input class="forminput" id="recoveryPassword" type="password" autocomplete="current-password" required>
<label class="label" for="recoveryCode">RECOVERY CODE</label><input class="forminput" id="recoveryCode" type="password" autocomplete="off" required>
<button class="add" type="submit">SIGN IN</button></form>
<p class="simple-status" id="recoveryStatus" role="status" aria-live="polite"></p></section></main>
<script>
document.getElementById('recoveryForm').addEventListener('submit', function (event) {
  event.preventDefault();
  var status = document.getElementById('recoveryStatus');
  var button = event.target.querySelector('button');
  button.disabled = true;
  status.textContent = 'Checking...';
  fetch('/api/auth/admin-recovery', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: document.getElementById('recoveryEmail').value,
      password: document.getElementById('recoveryPassword').value,
      recoveryCode: document.getElementById('recoveryCode').value,
    }),
  }).then(function (response) {
    if (response.ok) { window.location.assign('/admin'); return; }
    status.textContent = response.status === 429 ? 'Too many attempts. Please wait and try again.' : 'Those details are not correct, or this code has already been used.';
    button.disabled = false;
  }).catch(function () {
    status.textContent = 'Could not reach the server. Please try again.';
    button.disabled = false;
  });
});
</script></body></html>
